name: Android CI - generate wrapper & build Debug

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Generate wrapper if missing and build APK
    runs-on: ubuntu-latest
    env:
      # عدّل الإصدار هنا إذا أردت إصدار Gradle مختلف متوافق مع AGP لديك
      GRADLE_VERSION: 8.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure or install Gradle and generate wrapper if missing
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for existing gradlew..."
          if [ -f ./gradlew ] || [ -f ./app/gradlew ]; then
            echo "gradlew found in repo."
            # prefer repo-root gradlew if present
            if [ -f ./gradlew ]; then
              echo "Using existing ./gradlew"
            else
              echo "Using existing ./app/gradlew"
            fi
          else
            echo "No gradlew found — installing Gradle ${GRADLE_VERSION} to generate wrapper..."
            TMP_ZIP="gradle-${GRADLE_VERSION}.zip"
            DIST_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

            # Download and extract
            curl -sSLo "${TMP_ZIP}" "${DIST_URL}"
            unzip -q "${TMP_ZIP}" -d gradle-dist
            sudo mkdir -p /opt/gradle
            sudo mv gradle-dist/gradle-${GRADLE_VERSION} /opt/gradle/gradle-${GRADLE_VERSION}
            rm -rf gradle-dist "${TMP_ZIP}"

            # Make gradle available in current step and future steps
            echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" | sudo tee -a /etc/paths.d/gradle >/dev/null || true
            export PATH="/opt/gradle/gradle-${GRADLE_VERSION}/bin:${PATH}"

            # Generate wrapper at repository root (where settings.gradle(.kts) is)
            echo "Generating Gradle wrapper in repo root..."
            gradle --version
            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

            # Ensure wrapper executable
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
            fi
          fi

      - name: Make wrapper executable (double-check)
        if: always()
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
          if [ -f ./app/gradlew ]; then chmod +x ./app/gradlew; fi

      - name: Build :app assembleDebug
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting assembleDebug for :app"
          # Prefer repo-root gradlew if exists, otherwise use gradle from PATH or app/gradlew
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          elif [ -f ./app/gradlew ]; then
            (cd app && ./gradlew assembleDebug --no-daemon --stacktrace)
          else
            # fallback: try system gradle (should be present if installed earlier and exported to PATH)
            if command -v gradle >/dev/null 2>&1; then
              echo "Using system gradle to run wrapper task"
              gradle :app:assembleDebug --no-daemon --stacktrace
            else
              echo "ERROR: No gradlew and no gradle in PATH. Cannot build." >&2
              exit 1
            fi
          fi

      - name: List produced APKs (for debugging)
        if: always()
        run: |
          echo "Looking for APKs under app/build/outputs/"
          find app/build/outputs -type f -iname "*.apk" -maxdepth 5 -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/**/*.apk
