name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure gradlew is executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi
          if [ -f ./app/gradlew ]; then
            chmod +x ./app/gradlew
          fi

      - name: Build app (detect gradlew location to avoid duplicate paths)
        run: |
          set -e
          # If wrapper at repo root -> run it from root referencing module :app
          if [ -f ./gradlew ]; then
            echo "Using gradlew in repo root"
            ./gradlew :app:assembleRelease
          # If wrapper inside app/ -> run it from app directory
          elif [ -f ./app/gradlew ]; then
            echo "Using gradlew inside app/"
            (cd app && ./gradlew assembleRelease)
          else
            echo "ERROR: gradlew not found in repo root nor in app/ - please commit Gradle wrapper (gradlew, gradlew.bat, gradle/wrapper/) to the repo."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/**/*.apk
