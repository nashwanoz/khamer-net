name: Build Android Capacitor APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  NODE_VERSION: 18
  GRADLE_VERSION: 8.5
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

jobs:
  build-apk:
    name: Build APK (Capacitor path)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps and build web (Vite)
        run: |
          npm ci
          npm run build

      - name: Ensure capacitor config points to webDir=dist (create if missing)
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'JSON'
{
  "appId": "com.example.khamernet",
  "appName": "KhamrNet",
  "webDir": "dist"
}
JSON
            echo "Created capacitor.config.json (webDir=dist)."
          else
            echo "capacitor.config.json already present."
          fi

      - name: Install Capacitor CLI
        run: |
          npm install --no-save @capacitor/cli @capacitor/core

      - name: Add or sync Android platform with Capacitor
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d app ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ANDROID_SDK_ROOT}"
          cd "${ANDROID_SDK_ROOT}"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          curl -sSLo cmdline.zip "$URL"
          mkdir -p cmdline-tools
          unzip -q cmdline.zip -d cmdline-tools
          rm cmdline.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
          DIST_URL="https://services.gradle.org/distributions/${GRADLE_ZIP}"
          curl -sSLo "${GRADLE_ZIP}" "${DIST_URL}"
          unzip -q "${GRADLE_ZIP}" -d gradle-dist
          sudo mv gradle-dist/gradle-${GRADLE_VERSION} /opt/gradle/gradle-${GRADLE_VERSION}
          rm -rf gradle-dist "${GRADLE_ZIP}"
          export PATH="/opt/gradle/gradle-${GRADLE_VERSION}/bin:${PATH}"

      - name: Generate gradle wrapper in app/ if missing
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then
            /opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
            chmod +x ./gradlew
          else
            chmod +x ./gradlew
          fi

      - name: Copy web assets into Android
        run: |
          npx cap copy android

      - name: Build Android APK (assembleDebug) from app/
        working-directory: app
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/**/*.apk
